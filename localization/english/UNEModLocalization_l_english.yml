  UNE.1.t: "Welcome and WARNING!"
  UNE.1.d: "You start with a 20 year decaying modifier reducing your bureaucracy cost so that you don't start off in an unrecoverable deficit immediately. You'll need to build some more admin for the long-term, however."
  UNE.1.f: "\"This is outrageous! You signed away all our countries to the..... IS THIS A STELLARIS REFERENCE?\"!\n\"The hell's Stellaris?\""
  UNE.1.a: "\"I'll build up those government admins on the double!\""
  UNE.1.a.tooltip: "You'll need to build a lot of construction, really fast, to meet your eventual demands. As a Victoria 3 player though, I imagine you already know that."
  UNE.1.b: "You should also realize you have a unique primary culture :)"
  UNE.1.b.tooltip: "Homelands are also removed from every state too. Overtime, people will assimilate to this global, Human culture. Technically, on Multiculturalism, everyone is prejudiced against, but the effect is only -5% wage so it's fine."
  UNE.1.c: "Remember that you can change your starting laws in the game rules!"
  UNE_FLAVOR_TEXT: "The myriad Human nations that constitute their interstellar government are disparate, yet united in purpose. These bipedal mammalians have developed a society that encourages and even thrives on individual freedoms and cultural differences - as a result, Humans tend to integrate well with alien populations. Unforunately however, you're 400 years too early! You want to reach the stars? Then break ground on the Earth right here first   :)"
  SANDBOX:0 "The World is Yours!"

