l_english:
  UNE: "United Nations of Earth"
  UNE_ADJ: "Terrestrial"
  dyn_c_UNE_socialist: "Socialist World Republic"
  human: "Human"
  heritage_human: "Human Heritage"
  language_human: "Basic"
  empire_integration_grace_period: "Empire Integration Grace Period"
  heritage_group_human: "Human Heritage Group"
  language_group_human: "Basic Language Group"
  UNE.1.t: "Welcome and WARNING!"
  UNE.1.d: "You start with a 20 year decaying modifier reducing your bureaucracy cost so that you don't start off in an unrecoverable deficit immediately. You'll need to build some more admin for the long-term, however."
  UNE.1.f: "\"This is outrageous! You signed away all our countries to the..... IS THIS A STELLARIS REFERENCE?\"!\n\"The hell's Stellaris?\""
  UNE.1.a: "\"I'll build up those government admins on the double!\""
  UNE.1.a.tooltip: "You'll need to build a lot of construction, really fast, to meet your eventual demands. As a Victoria 3 player though, I imagine you already know that."
  UNE.1.b: "You should also realize you have a unique primary culture :)"
  UNE.1.b.tooltip: "Homelands are also removed from every state too. Overtime, people will assimilate to this global, Human culture. Technically, on Multiculturalism, everyone is prejudiced against, but the effect is only -5% wage so it's fine."
  UNE.1.c: "Remember that you can change your starting laws in the game rules!"
  UNE_FLAVOR_TEXT: "The myriad Human nations that constitute their interstellar government are disparate, yet united in purpose. These bipedal mammalians have developed a society that encourages and even thrives on individual freedoms and cultural differences - as a result, Humans tend to integrate well with alien populations. Unforunately however, you're 400 years too early! You want to reach the stars? Then break ground on the Earth right here first   :)"
  SANDBOX:0 "The Interstellar Mandate!"
 # === GOVERNANCE PRINCIPLES ===
   # === GOVERNANCE PRINCIPLES ===
  rule_governance_principles: "UNE: Governance Principles"
  setting_parliamentary_republic: "Parliamentary Republic"
  setting_parliamentary_republic_desc: "The UNE starts as a parliamentary republic, governed by a prime minister and legislative assembly."
  setting_monarchy: "Monarchy"
  setting_monarchy_desc: "The UNE starts as a Monarchy, led by a hereditary monarch."
  setting_theocracy: "Theocracy"
  setting_theocracy_desc: "The UNE starts as a Theocracy, guided by divine law and religious authorities."
  setting_presidential_republic: "Presidential Republic"
  setting_presidential_republic_desc: "The UNE starts as a Presidential Republic, featuring a strong, independently elected executive head of state."
  setting_council_republic: "Council Republic"
  setting_council_republic_desc: "The UNE starts as a Council Republic, structured around worker collectives and local councils."
  setting_corporate_state: "Corporate State"
  setting_corporate_state_desc: "The UNE starts as a Corporate State, where state power and commercial monopolies are deeply intertwined."
  setting_social_monarchy: "Social Monarchy"
  setting_social_monarchy_desc: "The UNE starts as a Social Monarchy, balancing a traditional crown with robust social institutions."

  # === ECONOMIC SYSTEM ===
  rule_economic_system: "UNE: Economic System"
  setting_interventionism: "Interventionism"
  setting_interventionism_desc: "The UNE economy starts with a system of flexible state subsidies and marketplace guidance."
  setting_command_economy: "Command Economy"
  setting_command_economy_desc: "The UNE economy starts under total centralized control, where the state directs production and industry."
  setting_cooperative_economy: "Cooperative Economy"
  setting_cooperative_economy_desc: "The UNE economy starts as a cooperative network run by worker-owned syndicates and cooperatives."
  setting_laissez_faire: "Laissez-Faire"
  setting_laissez_faire_desc: "The UNE economy starts completely deregulated, driven entirely by market demand and private capital."
  setting_agrarianism: "Agrarianism"
  setting_agrarianism_desc: "The UNE economy starts heavily focused on local agricultural development and rural optimization."

  # === DISTRIBUTION OF POWER ===
  rule_distribution_of_power: "UNE: Distribution of Power"
  setting_technocracy: "Technocracy"
  setting_technocracy_desc: "Power is held by credentialed experts, scientists, and administrative specialists."
  setting_autocracy: "Autocracy"
  setting_autocracy_desc: "Absolute executive authority is held by a single un-elected ruler."
  setting_oligarchy: "Oligarchy"
  setting_oligarchy_desc: "Power is concentrated within a tight inner circle of influential elites."
  setting_landed_voting: "Landed Voting"
  setting_landed_voting_desc: "Suffrage is restricted exclusively to wealthy landowners and nobility."
  setting_wealth_voting: "Wealth Voting"
  setting_wealth_voting_desc: "Only citizens meeting a high personal wealth or income threshold may vote."
  setting_census_voting: "Census Voting"
  setting_census_voting_desc: "Suffrage is granted to citizens who pass specific literacy or basic taxation criteria."
  setting_universal_voting: "Universal Voting"
  setting_universal_voting_desc: "The ballot box is wide open, giving voting rights to all regular citizens."
  setting_single_party_state: "Single-Party State"
  setting_single_party_state_desc: "Political competition is restricted to a single legally recognized party organization."
  setting_labor_suffrage: "Labor Suffrage"
  setting_labor_suffrage_desc: "Suffrage and political franchise are directly linked to trade union membership."

  # === LAND REFORM ===
  rule_land_reform: "UNE: Land Reform"
  setting_homesteading: "Homesteading"
  setting_homesteading_desc: "Agricultural land is divided into independently managed family-owned homestead farms."
  setting_tenant_farmers: "Tenant Farmers"
  setting_tenant_farmers_desc: "Rural lands are owned by wealthy aristocrats, with peasants working as dependent tenants."
  setting_collectivized_agriculture: "Collectivized Agriculture"
  setting_collectivized_agriculture_desc: "Farms are pooled together into large-scale, state-managed state or worker collectives."
  setting_commercialized_agriculture: "Commercialized Agriculture"
  setting_commercialized_agriculture_desc: "Agriculture is fully industrialized and managed by corporate agribusiness entities."